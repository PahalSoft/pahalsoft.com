<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512"
     role="img" aria-label="App Locker icon — a white padlock on a deep blue field">
  <!-- Traced from the app's own adaptive icon: ic_launcher_background (#1B3A5C)
       plus the paths in drawable/ic_launcher_foreground.xml, unchanged. -->
  <rect width="108" height="108" rx="24" fill="#1B3A5C"/>
  <!-- Padlock shackle -->
  <path d="M44,46 L44,40 A10,10 0 0,1 64,40 L64,46"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Padlock body -->
  <path d="M38,46 L70,46 A4,4 0 0,1 74,50 L74,70 A4,4 0 0,1 70,74 L38,74 A4,4 0 0,1 34,70 L34,50 A4,4 0 0,1 38,46 Z"
        fill="#FFFFFF"/>
  <!-- Keyhole -->
  <path d="M54,54 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" fill="#1B3A5C"/>
  <path d="M52,58 L56,58 L57,67 L51,67 Z" fill="#1B3A5C"/>
</svg>
